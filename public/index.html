<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Factory</title>
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Factory">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Navigation">
      <div class="brand"><img class="brand-mark" src="/icon.svg" alt=""> Factory</div>
      <nav id="side-nav"></nav>
      <div>
        <div class="side-heading">Projects</div>
        <nav id="side-projects"></nav>
      </div>
      <div class="side-foot">
        <span class="live" id="live-side">Connecting</span>
        <form method="post" action="/logout"><button class="icon-btn" title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
        </button></form>
      </div>
    </aside>

    <div>
      <header class="topbar" id="topbar">
        <img class="brand-mark brand" src="/icon.svg" alt="">
        <h1 id="title">Inbox</h1>
        <span class="live" id="live">Connecting</span>
        <button class="icon-btn" id="sync" title="Pull latest specs" aria-label="Pull latest specs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        </button>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grab"></div>
    <div class="sheet-head">
      <div><h2 id="sheet-title"></h2><div class="sub" id="sheet-sub"></div></div>
      <button class="icon-btn" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <script src="/app.js" type="module"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Factory · Sign in</title>
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login">
    <form class="card" method="post" action="/login">
      <h1><img class="brand-mark" src="/icon.svg" alt=""> Factory</h1>
      <p>Enter the dashboard password. This device stays signed in for a year.</p>
      <p class="error" id="error" hidden>That password didn't match.</p>
      <label class="sr-only" for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
  <script>
    if (location.search.includes("error")) document.getElementById("error").hidden = false;
    // A fragment survives the 302 that sent us here, but not the form POST — the browser
    // resolves action="/login" against this URL and drops it. So carry it in the query and let
    // the server put it back, or a notification tapped on a logged-out phone lands on the
    // default tab instead of the thing it was telling you about.
    // After a wrong password the fragment is already gone from the bar, so the server hands it
    // back in the query; on the first visit it is still a real fragment.
    const want = new URLSearchParams(location.search).get("next") || location.hash;
    if (/^#\/[\w\-./~%]*$/.test(want)) {
      document.querySelector("form").action = "/login?next=" + encodeURIComponent(want);
    }
  </script>
</body>
</html>
